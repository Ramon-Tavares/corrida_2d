<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Corrida 2D</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #111722;

    font-family: Arial, sans-serif;

    touch-action: none;
}

canvas {
    display: block;

    width: 100%;
    height: 100%;

    touch-action: none;
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<script>

"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 900;
let H = 600;

let dpr = 1;


/* =========================================================
   ESTADO DO JOGO
========================================================= */

let estado = "menu";

let pausado = false;

let pontos = 0;

let vidas = 3;

let velocidade = 5;

let deslocamento = 0;

let recorde =
    Number(
        localStorage.getItem(
            "corrida2d_recorde"
        ) || 0
    );


let jogador = null;

let inimigos = [];

let particulas = [];


/* =========================================================
   CONTROLES
========================================================= */

const teclado = {

    esquerda: false,

    direita: false
};


const toque = {

    esquerda: false,

    direita: false
};


/* =========================================================
   CORES DOS CARROS
========================================================= */

const coresCarros = [

    "#ff3333",
    "#00aaff",
    "#ffd000",
    "#ff6b00",
    "#9b30ff",
    "#00d084",
    "#ff4fa3",
    "#00d9ff"

];


/* =========================================================
   REDIMENSIONAR
========================================================= */

function redimensionar() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


window.addEventListener(
    "resize",
    redimensionar
);

redimensionar();


/* =========================================================
   RETÂNGULO
========================================================= */

function retangulo(
    x,
    y,
    largura,
    altura,
    cor
) {

    ctx.fillStyle = cor;

    ctx.fillRect(
        x,
        y,
        largura,
        altura
    );
}


/* =========================================================
   TEXTO
========================================================= */

function texto(
    mensagem,
    x,
    y,
    tamanho,
    cor = "#ffffff",
    alinhamento = "center"
) {

    ctx.fillStyle = cor;

    ctx.font =
        `bold ${tamanho}px Arial`;

    ctx.textAlign =
        alinhamento;

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        mensagem,
        x,
        y
    );
}


/* =========================================================
   INICIAR JOGO
========================================================= */

function iniciarJogo() {

    estado = "jogando";

    pausado = false;

    pontos = 0;

    vidas = 3;

    velocidade = 5;

    deslocamento = 0;

    particulas = [];


    jogador = {

        x:
            W / 2 - 25,

        y:
            H - 175,

        largura:
            50,

        altura:
            90,

        cor:
            "#168cff"
    };


    inimigos = [];


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        inimigos.push({

            x: 0,

            y: 0,

            largura: 50,

            altura: 90,

            velocidadeExtra:
                Math.random() * 2,

            cor:
                coresCarros[
                    Math.floor(
                        Math.random() *
                        coresCarros.length
                    )
                ]
        });


        reposicionarInimigo(
            inimigos[i],
            true
        );
    }


    limparControles();
}


/* =========================================================
   REPOSICIONAR INIMIGO
========================================================= */

function reposicionarInimigo(
    inimigo,
    inicial = false
) {

    const estradaLargura =
        Math.min(
            500,
            W * 0.60
        );


    const estradaEsquerda =
        W / 2 -
        estradaLargura / 2;


    inimigo.x =
        estradaEsquerda +
        Math.random() *
        (
            estradaLargura -
            inimigo.largura
        );


    if (inicial) {

        inimigo.y =
            -100 -
            Math.random() * H;

    } else {

        inimigo.y =
            -100 -
            Math.random() * 400;
    }


    inimigo.velocidadeExtra =
        Math.random() * 2;


    inimigo.cor =
        coresCarros[
            Math.floor(
                Math.random() *
                coresCarros.length
            )
        ];
}


/* =========================================================
   LIMITAR JOGADOR
========================================================= */

function limitarJogador() {

    const estradaLargura =
        Math.min(
            500,
            W * 0.60
        );


    const estradaEsquerda =
        W / 2 -
        estradaLargura / 2;


    const estradaDireita =
        W / 2 +
        estradaLargura / 2;


    if (
        jogador.x <
        estradaEsquerda
    ) {

        jogador.x =
            estradaEsquerda;
    }


    if (
        jogador.x +
        jogador.largura >
        estradaDireita
    ) {

        jogador.x =
            estradaDireita -
            jogador.largura;
    }
}


/* =========================================================
   CONTROLE ATIVO
========================================================= */

function controleAtivo(
    controle
) {

    return (
        teclado[controle] ||
        toque[controle]
    );
}


/* =========================================================
   LIMPAR CONTROLES
========================================================= */

function limparControles() {

    teclado.esquerda =
        false;

    teclado.direita =
        false;

    toque.esquerda =
        false;

    toque.direita =
        false;
}


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
    "keydown",
    function(evento) {

        if (
            evento.code ===
                "ArrowLeft" ||

            evento.code ===
                "ArrowRight" ||

            evento.code ===
                "Space"
        ) {

            evento.preventDefault();
        }


        /* ESQUERDA */

        if (
            evento.code ===
                "ArrowLeft" ||

            evento.code ===
                "KeyA"
        ) {

            teclado.esquerda =
                true;
        }


        /* DIREITA */

        if (
            evento.code ===
                "ArrowRight" ||

            evento.code ===
                "KeyD"
        ) {

            teclado.direita =
                true;
        }


        /* PAUSAR */

        if (
            evento.code ===
                "Escape" &&

            estado ===
                "jogando"
        ) {

            pausado =
                !pausado;
        }


        /* INICIAR / REINICIAR */

        if (
            (
                evento.code ===
                    "Enter" ||

                evento.code ===
                    "Space"
            ) &&

            (
                estado ===
                    "menu" ||

                estado ===
                    "gameover"
            )
        ) {

            iniciarJogo();
        }
    }
);


/* =========================================================
   SOLTAR TECLA
========================================================= */

window.addEventListener(
    "keyup",
    function(evento) {

        if (
            evento.code ===
                "ArrowLeft" ||

            evento.code ===
                "KeyA"
        ) {

            teclado.esquerda =
                false;
        }


        if (
            evento.code ===
                "ArrowRight" ||

            evento.code ===
                "KeyD"
        ) {

            teclado.direita =
                false;
        }
    }
);


/* =========================================================
   LIMPAR AO SAIR DA JANELA
========================================================= */

window.addEventListener(
    "blur",
    function() {

        limparControles();
    }
);


/* =========================================================
   POSIÇÃO DO TOQUE
========================================================= */

function pontoDoEvento(evento) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            evento.clientX -
            rect.left,

        y:
            evento.clientY -
            rect.top
    };
}


/* =========================================================
   CONTROLES DE TOQUE
========================================================= */

function processarToque(
    evento,
    pressionado
) {

    const ponto =
        pontoDoEvento(evento);


    if (!pressionado) {

        limparControles();

        return;
    }


    if (
        ponto.x <
        W / 2
    ) {

        toque.esquerda =
            true;

        toque.direita =
            false;

    } else {

        toque.esquerda =
            false;

        toque.direita =
            true;
    }
}


canvas.addEventListener(
    "pointerdown",
    function(evento) {

        evento.preventDefault();


        if (
            estado === "menu"
        ) {

            iniciarJogo();

            return;
        }


        if (
            estado ===
            "gameover"
        ) {

            iniciarJogo();

            return;
        }


        processarToque(
            evento,
            true
        );
    }
);


canvas.addEventListener(
    "pointermove",
    function(evento) {

        if (
            evento.buttons &&
            estado ===
                "jogando"
        ) {

            processarToque(
                evento,
                true
            );
        }
    }
);


canvas.addEventListener(
    "pointerup",
    function(evento) {

        evento.preventDefault();

        limparControles();
    }
);


canvas.addEventListener(
    "pointercancel",
    function() {

        limparControles();
    }
);


/* =========================================================
   COLISÃO
========================================================= */

function colidiu(a, b) {

    const margem = 10;


    return (

        a.x + margem <
        b.x +
        b.largura -
        margem

        &&

        a.x +
        a.largura -
        margem >
        b.x +
        margem

        &&

        a.y + margem <
        b.y +
        b.altura -
        margem

        &&

        a.y +
        a.altura -
        margem >
        b.y +
        margem
    );
}


/* =========================================================
   EXPLOSÃO
========================================================= */

function criarExplosao(
    x,
    y
) {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        particulas.push({

            x: x,

            y: y,

            vx:
                (
                    Math.random() -
                    0.5
                ) * 8,

            vy:
                (
                    Math.random() -
                    0.5
                ) * 8,

            vida: 1
        });
    }
}


/* =========================================================
   DESENHAR CARRO
========================================================= */

function desenharCarro(
    x,
    y,
    largura,
    altura,
    cor
) {

    /* Sombra */

    ctx.fillStyle =
        "rgba(0,0,0,0.35)";

    ctx.fillRect(
        x + 4,
        y + 5,
        largura,
        altura
    );


    /* Corpo */

    retangulo(
        x,
        y,
        largura,
        altura,
        cor
    );


    /* Capô */

    retangulo(
        x + 6,
        y + 6,
        largura - 12,
        18,
        cor
    );


    /* Teto */

    ctx.fillStyle =
        "#222831";

    ctx.beginPath();

    ctx.roundRect(
        x + 7,
        y + 20,
        largura - 14,
        40,
        7
    );

    ctx.fill();


    /* Vidro dianteiro */

    ctx.fillStyle =
        "#76d7ff";

    ctx.beginPath();

    ctx.moveTo(
        x + 12,
        y + 24
    );

    ctx.lineTo(
        x + largura - 12,
        y + 24
    );

    ctx.lineTo(
        x + largura - 16,
        y + 40
    );

    ctx.lineTo(
        x + 16,
        y + 40
    );

    ctx.closePath();

    ctx.fill();


    /* Vidro traseiro */

    ctx.fillStyle =
        "#4fa9d8";

    ctx.beginPath();

    ctx.moveTo(
        x + 16,
        y + 43
    );

    ctx.lineTo(
        x + largura - 16,
        y + 43
    );

    ctx.lineTo(
        x + largura - 12,
        y + 55
    );

    ctx.lineTo(
        x + 12,
        y + 55
    );

    ctx.closePath();

    ctx.fill();


    /* Faróis */

    retangulo(
        x + 5,
        y + 5,
        11,
        8,
        "#fff8a6"
    );


    retangulo(
        x +
        largura -
        16,
        y + 5,
        11,
        8,
        "#fff8a6"
    );


    /* Lanternas */

    retangulo(
        x + 5,
        y + altura - 13,
        11,
        8,
        "#ff2222"
    );


    retangulo(
        x +
        largura -
        16,
        y + altura - 13,
        11,
        8,
        "#ff2222"
    );


    /* Rodas */

    retangulo(
        x - 5,
        y + 18,
        7,
        23,
        "#111"
    );


    retangulo(
        x +
        largura -
        2,
        y + 18,
        7,
        23,
        "#111"
    );


    retangulo(
        x - 5,
        y + altura - 41,
        7,
        23,
        "#111"
    );


    retangulo(
        x +
        largura -
        2,
        y + altura - 41,
        7,
        23,
        "#111"
    );
}


/* =========================================================
   DESENHAR ESTRADA
========================================================= */

function desenharEstrada() {

    /* Grama */

    ctx.fillStyle =
        "#287b32";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const estradaLargura =
        Math.min(
            500,
            W * 0.60
        );


    const esquerda =
        W / 2 -
        estradaLargura / 2;


    /* Estrada */

    ctx.fillStyle =
        "#444";

    ctx.fillRect(
        esquerda,
        0,
        estradaLargura,
        H
    );


    /* Bordas */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        esquerda,
        0,
        6,
        H
    );


    ctx.fillRect(
        esquerda +
        estradaLargura -
        6,
        0,
        6,
        H
    );


    /* Faixas */

    const faixaLargura = 10;

    const faixaAltura = 60;

    const espaco = 45;


    ctx.fillStyle =
        "#ffffff";


    for (
        let y =
            -100 +
            deslocamento;

        y < H;

        y +=
            faixaAltura +
            espaco
    ) {

        ctx.fillRect(
            W / 2 -
                faixaLargura / 2,

            y,

            faixaLargura,

            faixaAltura
        );
    }
}


/* =========================================================
   ÁRVORE
========================================================= */

function desenharArvore(
    x,
    y
) {

    ctx.fillStyle =
        "#704214";

    ctx.fillRect(
        x - 7,
        y + 25,
        14,
        45
    );


    ctx.fillStyle =
        "#155b22";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        30,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   HUD
========================================================= */

function desenharHUD() {

    ctx.fillStyle =
        "rgba(0,0,0,0.45)";


    ctx.fillRect(
        10,
        10,
        285,
        125
    );


    texto(
        "Pontos: " +
        Math.floor(pontos),

        25,
        35,
        22,

        "#ffffff",

        "left"
    );


    texto(
        "Vidas: " +
        vidas,

        25,
        65,
        22,

        "#ff5555",

        "left"
    );


    texto(
        "Velocidade: " +
        velocidade.toFixed(1),

        25,
        95,
        18,

        "#ffff66",

        "left"
    );


    const proximo =
        (
            Math.floor(
                pontos / 50
            ) + 1
        ) * 50;


    texto(
        "Próximo aumento: " +
        proximo,

        25,
        120,
        14,

        "#cccccc",

        "left"
    );


    if (pausado) {

        ctx.fillStyle =
            "rgba(0,0,0,0.65)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        texto(
            "PAUSADO",

            W / 2,
            H / 2 - 20,

            50
        );


        texto(
            "Pressione ESC para continuar",

            W / 2,
            H / 2 + 35,

            20
        );
    }
}


/* =========================================================
   CONTROLES NA TELA
========================================================= */

function desenharControles() {

    const tamanho = 80;

    const margem = 20;

    const y =
        H -
        tamanho -
        margem;


    function botao(
        x,
        simbolo
    ) {

        ctx.fillStyle =
            "rgba(255,255,255,0.25)";


        ctx.beginPath();

        ctx.roundRect(
            x,
            y,
            tamanho,
            tamanho,
            15
        );

        ctx.fill();


        texto(
            simbolo,

            x +
                tamanho / 2,

            y +
                tamanho / 2,

            32
        );
    }


    botao(
        margem,
        "←"
    );


    botao(
        W -
            tamanho -
            margem,

        "→"
    );
}


/* =========================================================
   MENU
========================================================= */

function desenharMenu() {

    ctx.fillStyle =
        "#111722";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    texto(
        "CORRIDA 2D",

        W / 2,

        H / 2 - 110,

        55
    );


    texto(
        "Desvie dos carros!",

        W / 2,

        H / 2 - 50,

        22,

        "#cccccc"
    );


    ctx.fillStyle =
        "#1f8cff";


    ctx.beginPath();

    ctx.roundRect(
        W / 2 - 150,
        H / 2,
        300,
        70,
        15
    );

    ctx.fill();


    texto(
        "COMEÇAR",

        W / 2,

        H / 2 + 35,

        28
    );


    texto(
        "← → ou A / D para controlar",

        W / 2,

        H / 2 + 110,

        18,

        "#bbbbbb"
    );


    texto(
        "A velocidade aumenta a cada 50 pontos!",

        W / 2,

        H / 2 + 140,

        16,

        "#ffff66"
    );
}


/* =========================================================
   GAME OVER
========================================================= */

function desenharGameOver() {

    ctx.fillStyle =
        "#111722";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    texto(
        "GAME OVER",

        W / 2,

        H / 2 - 110,

        55,

        "#ff4444"
    );


    texto(
        "Pontuação: " +
        Math.floor(pontos),

        W / 2,

        H / 2 - 40,

        28
    );


    texto(
        "Recorde: " +
        recorde,

        W / 2,

        H / 2,

        24,

        "#ffff55"
    );


    ctx.fillStyle =
        "#1f8cff";


    ctx.beginPath();

    ctx.roundRect(
        W / 2 - 150,
        H / 2 + 55,
        300,
        70,
        15
    );

    ctx.fill();


    texto(
        "JOGAR NOVAMENTE",

        W / 2,

        H / 2 + 90,

        24
    );
}


/* =========================================================
   DESENHAR JOGO
========================================================= */

function desenharJogo() {

    desenharEstrada();


    /* Árvores */

    for (
        let y =
            -100 +
            (
                deslocamento *
                0.7
            ) % 180;

        y < H;

        y += 180
    ) {

        const estradaLargura =
            Math.min(
                500,
                W * 0.60
            );


        const esquerda =
            W / 2 -
            estradaLargura / 2;


        desenharArvore(
            esquerda - 45,
            y
        );


        desenharArvore(
            esquerda +
            estradaLargura +
            45,

            y + 70
        );
    }


    /* Inimigos */

    for (
        const inimigo of inimigos
    ) {

        desenharCarro(

            inimigo.x,

            inimigo.y,

            inimigo.largura,

            inimigo.altura,

            inimigo.cor
        );
    }


    /* Jogador */

    if (jogador) {

        desenharCarro(

            jogador.x,

            jogador.y,

            jogador.largura,

            jogador.altura,

            jogador.cor
        );
    }


    /* Partículas */

    for (
        const p of particulas
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.vida
            );


        retangulo(
            p.x,
            p.y,
            5,
            5,
            "#ffcc00"
        );


        ctx.globalAlpha = 1;
    }


    desenharHUD();

    desenharControles();
}


/* =========================================================
   ATUALIZAR JOGO
========================================================= */

let ultimoTempo =
    performance.now();


function atualizar() {

    const agora =
        performance.now();


    let delta =
        (
            agora -
            ultimoTempo
        ) / 1000;


    ultimoTempo =
        agora;


    if (
        delta > 0.05
    ) {

        delta = 0.05;
    }


    if (
        estado === "jogando" &&
        !pausado
    ) {


        /* =========================================
           VELOCIDADE AUTOMÁTICA

           0 pontos   = 5.0
           50 pontos  = 5.5
           100 pontos = 6.0
           150 pontos = 6.5
           200 pontos = 7.0
           250 pontos = 7.5

           ...

           1000 pontos = 15.0
        ========================================= */


        const velocidadeAlvo =
            Math.min(
                15,

                5 +
                Math.floor(
                    pontos / 50
                ) *
                0.5
            );


        /* Aumenta suavemente */

        if (
            velocidade <
            velocidadeAlvo
        ) {

            velocidade +=
                0.025 *
                delta *
                60;
        }


        /* Limite máximo */

        velocidade =
            Math.min(
                15,
                velocidade
            );


        /* =========================================
           MOVIMENTO DO JOGADOR
        ========================================= */

        if (
            controleAtivo(
                "esquerda"
            )
        ) {

            jogador.x -=
                8 *
                delta *
                60;
        }


        if (
            controleAtivo(
                "direita"
            )
        ) {

            jogador.x +=
                8 *
                delta *
                60;
        }


        limitarJogador();


        /* =========================================
           MOVIMENTO DA ESTRADA
        ========================================= */

        deslocamento +=
            velocidade *
            delta *
            60;


        deslocamento %= 105;


        /* =========================================
           INIMIGOS
        ========================================= */

        for (
            let i = 0;
            i < inimigos.length;
            i++
        ) {

            const inimigo =
                inimigos[i];


            inimigo.y +=
                (
                    velocidade +
                    inimigo.velocidadeExtra
                ) *
                delta *
                60;


            /* Saiu da tela */

            if (
                inimigo.y >
                H + 100
            ) {

                pontos += 10;


                reposicionarInimigo(
                    inimigo
                );
            }


            /* Colisão */

            if (
                jogador &&
                colidiu(
                    jogador,
                    inimigo
                )
            ) {

                criarExplosao(

                    jogador.x +
                    jogador.largura / 2,

                    jogador.y +
                    jogador.altura / 2
                );


                vidas--;


                reposicionarInimigo(
                    inimigo
                );


                jogador.x =
                    W / 2 -
                    jogador.largura / 2;


                if (
                    vidas <= 0
                ) {

                    estado =
                        "gameover";


                    if (
                        pontos >
                        recorde
                    ) {

                        recorde =
                            Math.floor(
                                pontos
                            );


                        localStorage.setItem(

                            "corrida2d_recorde",

                            recorde
                        );
                    }
                }
            }
        }


        /* =========================================
           PARTÍCULAS
        ========================================= */

        for (
            let i =
                particulas.length - 1;

            i >= 0;

            i--
        ) {

            const p =
                particulas[i];


            p.x +=
                p.vx;

            p.y +=
                p.vy;

            p.vy +=
                0.2;

            p.vida -=
                0.03;


            if (
                p.vida <= 0
            ) {

                particulas.splice(
                    i,
                    1
                );
            }
        }
    }


    desenhar();


    requestAnimationFrame(
        atualizar
    );
}


/* =========================================================
   DESENHAR
========================================================= */

function desenhar() {

    if (
        estado === "menu"
    ) {

        desenharMenu();

    }

    else if (
        estado === "jogando"
    ) {

        desenharJogo();

    }

    else if (
        estado === "gameover"
    ) {

        desenharGameOver();
    }
}


/* =========================================================
   CLIQUE NO MENU
========================================================= */

canvas.addEventListener(
    "click",
    function(evento) {

        const ponto =
            pontoDoEvento(evento);


        if (
            estado === "menu"
        ) {

            if (
                ponto.x >
                    W / 2 - 150 &&

                ponto.x <
                    W / 2 + 150 &&

                ponto.y >
                    H / 2 &&

                ponto.y <
                    H / 2 + 70
            ) {

                iniciarJogo();
            }
        }


        else if (
            estado ===
            "gameover"
        ) {

            if (
                ponto.x >
                    W / 2 - 150 &&

                ponto.x <
                    W / 2 + 150 &&

                ponto.y >
                    H / 2 + 55 &&

                ponto.y <
                    H / 2 + 125
            ) {

                iniciarJogo();
            }
        }
    }
);


/* =========================================================
   INICIAR
========================================================= */

desenhar();

requestAnimationFrame(
    atualizar
);

</script>
