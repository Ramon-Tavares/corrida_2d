<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrida 2D</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111722;
    font-family: Arial, sans-serif;
}

body {
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 900;
let H = 600;
let dpr = 1;

let estado = "menu";
let pausado = false;

let pontos = 0;
let vidas = 3;
let velocidade = 5;
let deslocamento = 0;

let recorde = Number(
    localStorage.getItem("corrida2d_recorde") || 0
);

let jogador = null;
let inimigos = [];
let particulas = [];

const teclado = {
    esquerda: false,
    direita: false,
    cima: false,
    baixo: false
};

const toque = {
    esquerda: false,
    direita: false,
    cima: false,
    baixo: false
};


/* =========================================================
   TAMANHO DA TELA
========================================================= */

function redimensionar() {

    W = window.innerWidth;
    H = window.innerHeight;

    if (W < 500) W = 500;
    if (H < 400) H = 400;

    dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    if (jogador) {

        jogador.y = H - 175;

        limitarJogador();
    }
}

window.addEventListener(
    "resize",
    redimensionar
);

redimensionar();


/* =========================================================
   RETÂNGULO ARREDONDADO
========================================================= */

function retangulo(
    x,
    y,
    largura,
    altura,
    raio,
    cor
) {

    ctx.beginPath();

    ctx.moveTo(
        x + raio,
        y
    );

    ctx.lineTo(
        x + largura - raio,
        y
    );

    ctx.quadraticCurveTo(
        x + largura,
        y,
        x + largura,
        y + raio
    );

    ctx.lineTo(
        x + largura,
        y + altura - raio
    );

    ctx.quadraticCurveTo(
        x + largura,
        y + altura,
        x + largura - raio,
        y + altura
    );

    ctx.lineTo(
        x + raio,
        y + altura
    );

    ctx.quadraticCurveTo(
        x,
        y + altura,
        x,
        y + altura - raio
    );

    ctx.lineTo(
        x,
        y + raio
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + raio,
        y
    );

    ctx.closePath();

    ctx.fillStyle = cor;

    ctx.fill();
}


/* =========================================================
   TEXTO
========================================================= */

function texto(
    mensagem,
    tamanho,
    cor,
    x,
    y
) {

    ctx.font =
        "bold " +
        tamanho +
        "px Arial";

    ctx.fillStyle = cor;

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    ctx.fillText(
        mensagem,
        x,
        y
    );
}


/* =========================================================
   PISTA
========================================================= */

function pista() {

    const larguraPista =
        Math.min(
            560,
            Math.max(
                440,
                W * 0.54
            )
        );

    return {

        esquerda:
            W / 2 -
            larguraPista / 2,

        direita:
            W / 2 +
            larguraPista / 2,

        largura:
            larguraPista
    };
}


/* =========================================================
   INICIAR JOGO
========================================================= */

function iniciarJogo() {

    pontos = 0;

    vidas = 3;

    velocidade = 5;

    deslocamento = 0;

    pausado = false;

    jogador = {

        x:
            W / 2 - 28,

        y:
            H - 175,

        largura: 56,

        altura: 92

    };

    inimigos = [];

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        inimigos.push(
            criarInimigo(i)
        );
    }

    particulas = [];

    limparControles();

    estado = "jogando";
}


/* =========================================================
   CRIAR INIMIGO
========================================================= */

function criarInimigo(indice) {

    const cores = [

        "#2878e8",
        "#f2cf32",
        "#ef6c25",
        "#a447c4",
        "#20b7b7"

    ];

    const inimigo = {

        x: 0,

        y: 0,

        largura: 56,

        altura: 92,

        velocidade:
            5 + Math.random() * 3,

        cor:
            cores[
                indice %
                cores.length
            ]

    };

    reposicionarInimigo(
        inimigo,
        true
    );

    return inimigo;
}


/* =========================================================
   REPOSICIONAR INIMIGO
========================================================= */

function reposicionarInimigo(
    inimigo,
    inicio
) {

    const r = pista();

    const minimo =
        r.esquerda + 35;

    const maximo =
        r.direita -
        inimigo.largura -
        35;

    inimigo.x =
        minimo +
        Math.random() *
        Math.max(
            1,
            maximo - minimo
        );

    inimigo.y =
        inicio
            ? -180 - Math.random() * 700
            : -180 - Math.random() * 450;
}


/* =========================================================
   LIMITAR JOGADOR
========================================================= */

function limitarJogador() {

    if (!jogador) return;

    const r = pista();

    const minimo =
        r.esquerda + 25;

    const maximo =
        r.direita -
        jogador.largura -
        25;

    jogador.x =
        Math.max(
            minimo,
            Math.min(
                maximo,
                jogador.x
            )
        );
}


/* =========================================================
   COLISÃO
========================================================= */

function colidiu(a, b) {

    const margem = 8;

    return (

        a.x + margem <
        b.x + b.largura - margem

        &&

        a.x + a.largura - margem >
        b.x + margem

        &&

        a.y + margem <
        b.y + b.altura - margem

        &&

        a.y + a.altura - margem >
        b.y + margem

    );
}


/* =========================================================
   CARRO
========================================================= */

function desenharCarro(
    x,
    y,
    largura,
    altura,
    cor,
    jogador
) {

    /* sombra */

    retangulo(
        x + 4,
        y + 5,
        largura,
        altura,
        10,
        "rgba(0,0,0,.35)"
    );


    /* corpo */

    retangulo(
        x,
        y,
        largura,
        altura,
        10,
        cor
    );


    /* vidro dianteiro */

    retangulo(
        x + 9,
        y + 14,
        largura - 18,
        26,
        6,
        "#183b58"
    );


    /* vidro traseiro */

    retangulo(
        x + 9,
        y + altura - 38,
        largura - 18,
        22,
        6,
        "#102d43"
    );


    /* rodas */

    retangulo(
        x - 5,
        y + 18,
        12,
        29,
        5,
        "#111"
    );

    retangulo(
        x + largura - 7,
        y + 18,
        12,
        29,
        5,
        "#111"
    );

    retangulo(
        x - 5,
        y + altura - 47,
        12,
        29,
        5,
        "#111"
    );

    retangulo(
        x + largura - 7,
        y + altura - 47,
        12,
        29,
        5,
        "#111"
    );


    /* faróis */

    retangulo(
        x + 7,
        y + 5,
        13,
        8,
        3,
        jogador
            ? "#fff0a0"
            : "#ff5151"
    );

    retangulo(
        x + largura - 20,
        y + 5,
        13,
        8,
        3,
        jogador
            ? "#fff0a0"
            : "#ff5151"
    );


    /* reflexo */

    ctx.fillStyle =
        "rgba(255,255,255,.2)";

    ctx.fillRect(
        x + 13,
        y + 20,
        6,
        18
    );


    /* detalhe do jogador */

    if (jogador) {

        ctx.fillStyle =
            "#ffe13d";

        ctx.fillRect(
            x + 5,
            y + altura - 7,
            largura - 10,
            4
        );
    }
}


/* =========================================================
   ÁRVORE
========================================================= */

function desenharArvore(
    x,
    y,
    escala
) {

    ctx.fillStyle =
        "#65452d";

    ctx.fillRect(
        x - 5 * escala,
        y + 15 * escala,
        10 * escala,
        35 * escala
    );


    ctx.fillStyle =
        "#23723a";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        24 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
        "#31954b";

    ctx.beginPath();

    ctx.arc(
        x - 12 * escala,
        y + 2 * escala,
        15 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x + 12 * escala,
        y + 3 * escala,
        15 * escala,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================================================
   CENÁRIO
========================================================= */

function desenharCenario() {

    const gradiente =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradiente.addColorStop(
        0,
        "#65bdf0"
    );

    gradiente.addColorStop(
        0.5,
        "#d9f1fa"
    );

    gradiente.addColorStop(
        0.51,
        "#69bd5c"
    );

    gradiente.addColorStop(
        1,
        "#398c43"
    );

    ctx.fillStyle =
        gradiente;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* sol */

    ctx.fillStyle =
        "#ffe58a";

    ctx.beginPath();

    ctx.arc(
        W * 0.82,
        H * 0.14,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();


    const r = pista();


    /* árvores */

    const distancia = 105;

    for (
        let y =
            (-deslocamento * 0.6)
            % distancia - 30;

        y < H + distancia;

        y += distancia
    ) {

        desenharArvore(
            r.esquerda - 60,
            y + 25,
            1
        );

        desenharArvore(
            r.direita + 60,
            y + 50,
            0.9
        );
    }


    /* pista */

    ctx.fillStyle =
        "#30343a";

    ctx.fillRect(
        r.esquerda,
        0,
        r.largura,
        H
    );


    /* bordas */

    ctx.fillStyle =
        "#d7d7d7";

    ctx.fillRect(
        r.esquerda,
        0,
        10,
        H
    );

    ctx.fillRect(
        r.direita - 10,
        0,
        10,
        H
    );


    /* faixas vermelhas */

    ctx.fillStyle =
        "#e33b3b";

    for (
        let y =
            (-deslocamento) % 36;

        y < H + 36;

        y += 72
    ) {

        ctx.fillRect(
            r.esquerda,
            y,
            10,
            36
        );

        ctx.fillRect(
            r.direita - 10,
            y,
            10,
            36
        );
    }


    /* faixas centrais */

    ctx.fillStyle =
        "#eeeeee";

    const faixas = [

        r.esquerda +
        r.largura / 4,

        r.esquerda +
        r.largura / 2,

        r.esquerda +
        r.largura * 3 / 4

    ];


    for (
        let i = 0;
        i < faixas.length;
        i++
    ) {

        for (
            let y =
                (-deslocamento) %
                110 - 80;

            y < H + 110;

            y += 110
        ) {

            ctx.fillRect(
                faixas[i] - 4,
                y,
                8,
                60
            );
        }
    }
}


/* =========================================================
   BOTÕES
========================================================= */

function desenharBotao(
    x,
    y,
    largura,
    altura,
    simbolo,
    ativo
) {

    retangulo(
        x,
        y,
        largura,
        altura,
        14,
        ativo
            ? "#e0a82c"
            : "rgba(20,28,40,.82)"
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.3)";

    ctx.lineWidth = 2;

    ctx.stroke();

    texto(
        simbolo,
        38,
        "#fff",
        x + largura / 2,
        y + altura / 2
    );
}


function desenharControles() {

    const botoes = {

        esquerda: {
            x: 30,
            y: H - 100,
            largura: 110,
            altura: 65
        },

        direita: {
            x: 155,
            y: H - 100,
            largura: 110,
            altura: 65
        },

        cima: {
            x: W - 135,
            y: H - 175,
            largura: 100,
            altura: 65
        },

        baixo: {
            x: W - 135,
            y: H - 95,
            largura: 100,
            altura: 65
        },

        pausa: {
            x: W - 80,
            y: 18,
            largura: 60,
            altura: 48
        }

    };


    desenharBotao(
        botoes.esquerda.x,
        botoes.esquerda.y,
        botoes.esquerda.largura,
        botoes.esquerda.altura,
        "‹",
        controleAtivo("esquerda")
    );


    desenharBotao(
        botoes.direita.x,
        botoes.direita.y,
        botoes.direita.largura,
        botoes.direita.altura,
        "›",
        controleAtivo("direita")
    );


    desenharBotao(
        botoes.cima.x,
        botoes.cima.y,
        botoes.cima.largura,
        botoes.cima.altura,
        "↑",
        controleAtivo("cima")
    );


    desenharBotao(
        botoes.baixo.x,
        botoes.baixo.y,
        botoes.baixo.largura,
        botoes.baixo.altura,
        "↓",
        controleAtivo("baixo")
    );


    desenharBotao(
        botoes.pausa.x,
        botoes.pausa.y,
        botoes.pausa.largura,
        botoes.pausa.altura,
        pausado ? "▶" : "Ⅱ",
        false
    );

    return botoes;
}


/* =========================================================
   HUD
========================================================= */

function desenharHUD() {

    retangulo(
        14,
        14,
        260,
        75,
        13,
        "rgba(10,17,27,.75)"
    );

    texto(
        "PONTOS",
        14,
        "#aeb8c5",
        32,
        34
    );

    texto(
        String(pontos),
        27,
        "#fff",
        32,
        62
    );


    texto(
        "VIDAS",
        14,
        "#aeb8c5",
        128,
        34
    );


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        texto(
            i < vidas ? "♥" : "♡",
            22,
            i < vidas
                ? "#ff5360"
                : "#657080",
            130 + i * 24,
            62
        );
    }


    retangulo(
        W - 145,
        14,
        130,
        75,
        13,
        "rgba(10,17,27,.75)"
    );


    texto(
        "VELOCIDADE",
        11,
        "#aeb8c5",
        W - 80,
        33
    );


    texto(
        Math.floor(
            velocidade * 12
        ) + " km/h",
        21,
        "#ffd43d",
        W - 80,
        62
    );
}


/* =========================================================
   MENU
========================================================= */

function desenharMenu() {

    ctx.fillStyle =
        "#101722";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    texto(
        "CORRIDA",
        Math.min(72, W * 0.08),
        "#fff",
        W / 2,
        H * 0.20
    );


    texto(
        "2D",
        Math.min(82, W * 0.10),
        "#ffd43b",
        W / 2,
        H * 0.31
    );


    texto(
        "TURBO",
        25,
        "#91a3ba",
        W / 2,
        H * 0.38
    );


    const botao = {

        x: W / 2 - 145,

        y: H * 0.50,

        largura: 290,

        altura: 75

    };


    retangulo(
        botao.x,
        botao.y,
        botao.largura,
        botao.altura,
        17,
        "#27a75b"
    );


    texto(
        "▶  JOGAR",
        33,
        "#fff",
        W / 2,
        botao.y +
        botao.altura / 2
    );


    texto(
        "RECORDE  " + recorde,
        23,
        "#ffd43b",
        W / 2,
        H * 0.67
    );


    texto(
        "WASD / SETAS  •  TOQUE",
        17,
        "#aab7c7",
        W / 2,
        H * 0.74
    );


    desenharCarro(
        W / 2 - 28,
        H * 0.81,
        56,
        92,
        "#e23838",
        true
    );
}


/* =========================================================
   JOGO
========================================================= */

function desenharJogo() {

    desenharCenario();


    for (
        let i = 0;
        i < inimigos.length;
        i++
    ) {

        const inimigo =
            inimigos[i];

        desenharCarro(
            inimigo.x,
            inimigo.y,
            inimigo.largura,
            inimigo.altura,
            inimigo.cor,
            false
        );
    }


    desenharCarro(
        jogador.x,
        jogador.y,
        jogador.largura,
        jogador.altura,
        "#e23838",
        true
    );


    for (
        let i = 0;
        i < particulas.length;
        i++
    ) {

        const p =
            particulas[i];

        ctx.fillStyle =
            "rgba(255,215,70," +
            Math.max(
                0,
                p.vida * 2
            ) +
            ")";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    desenharHUD();

    desenharControles();


    if (pausado) {

        ctx.fillStyle =
            "rgba(0,0,0,.62)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );


        retangulo(
            W / 2 - 190,
            H / 2 - 75,
            380,
            150,
            20,
            "#182131"
        );


        texto(
            "PAUSADO",
            43,
            "#fff",
            W / 2,
            H / 2 - 20
        );


        texto(
            "Toque em Ⅱ para continuar",
            19,
            "#aeb9c5",
            W / 2,
            H / 2 + 30
        );
    }
}


/* =========================================================
   GAME OVER
========================================================= */

function desenharGameOver() {

    ctx.fillStyle =
        "#111722";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    texto(
        "FIM DE JOGO",
        Math.min(
            62,
            W * 0.07
        ),
        "#ff5360",
        W / 2,
        H * 0.25
    );


    texto(
        "PONTOS",
        18,
        "#aeb9c5",
        W / 2,
        H * 0.39
    );


    texto(
        String(pontos),
        48,
        "#fff",
        W / 2,
        H * 0.46
    );


    texto(
        "Recorde: " + recorde,
        27,
        "#ffd43b",
        W / 2,
        H * 0.55
    );


    const botao = {

        x: W / 2 - 150,

        y: H * 0.66,

        largura: 300,

        altura: 72

    };


    retangulo(
        botao.x,
        botao.y,
        botao.largura,
        botao.altura,
        17,
        "#27a75b"
    );


    texto(
        "↻  JOGAR NOVAMENTE",
        24,
        "#fff",
        W / 2,
        botao.y +
        botao.altura / 2
    );
}


/* =========================================================
   CONTROLES
========================================================= */

function controleAtivo(
    controle
) {

    return (
        teclado[controle] ||
        toque[controle]
    );
}


function limparControles() {

    teclado.esquerda = false;
    teclado.direita = false;
    teclado.cima = false;
    teclado.baixo = false;

    toque.esquerda = false;
    toque.direita = false;
    toque.cima = false;
    toque.baixo = false;
}


/* =========================================================
   TOQUE / MOUSE
========================================================= */

function pontoDoEvento(
    evento
) {

    const r =
        canvas.getBoundingClientRect();

    return {

        x:
            (evento.clientX - r.left) *
            (W / r.width),

        y:
            (evento.clientY - r.top) *
            (H / r.height)

    };
}


function estaDentro(
    botao,
    x,
    y
) {

    return (

        x >= botao.x &&

        x <=
        botao.x +
        botao.largura &&

        y >= botao.y &&

        y <=
        botao.y +
        botao.altura

    );
}


function processarToque(
    x,
    y
) {

    if (estado === "menu") {

        const botao = {

            x: W / 2 - 145,

            y: H * 0.50,

            largura: 290,

            altura: 75

        };

        if (
            estaDentro(
                botao,
                x,
                y
            )
        ) {

            iniciarJogo();
        }

        return;
    }


    if (estado === "gameover") {

        const botao = {

            x: W / 2 - 150,

            y: H * 0.66,

            largura: 300,

            altura: 72

        };

        if (
            estaDentro(
                botao,
                x,
                y
            )
        ) {

            iniciarJogo();
        }

        return;
    }


    const botoes = {

        esquerda: {
            x: 30,
            y: H - 100,
            largura: 110,
            altura: 65
        },

        direita: {
            x: 155,
            y: H - 100,
            largura: 110,
            altura: 65
        },

        cima: {
            x: W - 135,
            y: H - 175,
            largura: 100,
            altura: 65
        },

        baixo: {
            x: W - 135,
            y: H - 95,
            largura: 100,
            altura: 65
        },

        pausa: {
            x: W - 80,
            y: 18,
            largura: 60,
            altura: 48
        }

    };


    if (
        estaDentro(
            botoes.pausa,
            x,
            y
        )
    ) {

        pausado =
            !pausado;

        return;
    }


    if (pausado) return;


    if (
        estaDentro(
            botoes.esquerda,
            x,
            y
        )
    ) {

        toque.esquerda = true;

    } else if (
        estaDentro(
            botoes.direita,
            x,
            y
        )
    ) {

        toque.direita = true;

    } else if (
        estaDentro(
            botoes.cima,
            x,
            y
        )
    ) {

        toque.cima = true;

    } else if (
        estaDentro(
            botoes.baixo,
            x,
            y
        )
    ) {

        toque.baixo = true;
    }
}


canvas.addEventListener(
    "pointerdown",
    function (evento) {

        evento.preventDefault();

        const ponto =
            pontoDoEvento(
                evento
            );

        processarToque(
            ponto.x,
            ponto.y
        );
    }
);


canvas.addEventListener(
    "pointerup",
    function (evento) {

        evento.preventDefault();

        limparControles();
    }
);


canvas.addEventListener(
    "pointercancel",
    limparControles
);


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
    "keydown",
    function (evento) {

        const tecla =
            evento.key.toLowerCase();


        if (
            tecla === "a" ||
            evento.key === "ArrowLeft"
        ) {

            teclado.esquerda = true;
        }


        if (
            tecla === "d" ||
            evento.key === "ArrowRight"
        ) {

            teclado.direita = true;
        }


        if (
            tecla === "w" ||
            evento.key === "ArrowUp"
        ) {

            teclado.cima = true;
        }


        if (
            tecla === "s" ||
            evento.key === "ArrowDown"
        ) {

            teclado.baixo = true;
        }


        if (
            evento.key === "Escape" &&
            estado === "jogando"
        ) {

            pausado =
                !pausado;
        }
    }
);


window.addEventListener(
    "keyup",
    function (evento) {

        const tecla =
            evento.key.toLowerCase();


        if (
            tecla === "a" ||
            evento.key === "ArrowLeft"
        ) {

            teclado.esquerda = false;
        }


        if (
            tecla === "d" ||
            evento.key === "ArrowRight"
        ) {

            teclado.direita = false;
        }


        if (
            tecla === "w" ||
            evento.key === "ArrowUp"
        ) {

            teclado.cima = false;
        }


        if (
            tecla === "s" ||
            evento.key === "ArrowDown"
        ) {

            teclado.baixo = false;
        }
    }
);


/* =========================================================
   ATUALIZAÇÃO
========================================================= */

let ultimoTempo =
    performance.now();


function atualizar() {

    const agora =
        performance.now();

    let delta =
        (agora - ultimoTempo) /
        1000;

    ultimoTempo =
        agora;

    if (delta > 0.05) {
        delta = 0.05;
    }


    if (
        estado === "jogando" &&
        !pausado
    ) {

        if (
            controleAtivo("cima")
        ) {

            velocidade +=
                0.12 *
                delta *
                60;
        }


        if (
            controleAtivo("baixo")
        ) {

            velocidade -=
                0.12 *
                delta *
                60;
        }


        velocidade =
            Math.max(
                2,
                Math.min(
                    15,
                    velocidade
                )
            );


        if (
            controleAtivo(
                "esquerda"
            )
        ) {

            jogador.x -=
                7 *
                delta *
                60;
        }


        if (
            controleAtivo(
                "direita"
            )
        ) {

            jogador.x +=
                7 *
                delta *
                60;
        }


        limitarJogador();


        deslocamento +=
            velocidade *
            delta *
            60;

        deslocamento %=
            110;


        for (
            let i = 0;
            i < inimigos.length;
            i++
        ) {

            const inimigo =
                inimigos[i];


            inimigo.y +=
                (
                    inimigo.velocidade +
                    velocidade
                ) *
                delta *
                60;


            if (
                inimigo.y >
                H + 100
            ) {

                reposicionarInimigo(
                    inimigo,
                    false
                );

                pontos += 10;
            }


            if (
                colidiu(
                    jogador,
                    inimigo
                )
            ) {

                vidas--;

                criarExplosao(
                    inimigo.x +
                    inimigo.largura / 2,

                    inimigo.y +
                    inimigo.altura / 2
                );


                reposicionarInimigo(
                    inimigo,
                    false
                );


                if (vidas <= 0) {

                    if (
                        pontos >
                        recorde
                    ) {

                        recorde =
                            pontos;

                        try {

                            localStorage.setItem(
                                "corrida2d_recorde",
                                String(recorde)
                            );

                        } catch (erro) {}
                    }


                    estado =
                        "gameover";

                    limparControles();
                }
            }
        }


        for (
            let i =
                particulas.length - 1;

            i >= 0;

            i--
        ) {

            const p =
                particulas[i];

            p.x +=
                p.velocidadeX *
                delta *
                60;

            p.y +=
                p.velocidadeY *
                delta *
                60;

            p.vida -=
                delta;


            if (
                p.vida <= 0
            ) {

                particulas.splice(
                    i,
                    1
                );
            }
        }
    }


    desenhar();

    requestAnimationFrame(
        atualizar
    );
}


/* =========================================================
   EXPLOSÃO
========================================================= */

function criarExplosao(
    x,
    y
) {

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const angulo =
            Math.random() *
            Math.PI *
            2;

        const velocidadeParticula =
            2 +
            Math.random() *
            4;


        particulas.push({

            x: x,

            y: y,

            velocidadeX:
                Math.cos(angulo) *
                velocidadeParticula,

            velocidadeY:
                Math.sin(angulo) *
                velocidadeParticula,

            vida: 0.5
        });
    }
}


/* =========================================================
   DESENHAR
========================================================= */

function desenhar() {

    if (
        estado === "menu"
    ) {

        desenharMenu();

    } else if (
        estado === "jogando"
    ) {

        desenharJogo();

    } else {

        desenharGameOver();
    }
}


/* =========================================================
   INICIAR
========================================================= */

desenhar();

requestAnimationFrame(
    atualizar
);

</script>
